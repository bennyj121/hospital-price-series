name: cms-hpt.txt index question
description: Question about the free hospital-mrf-index Action (fetch cms-hpt.txt, write MRF URLs).
title: "[index] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Free GitHub Action hospital-mrf-index: fetch a hospital cms-hpt.txt and write published mrf-url lines. Optional CPT extract from a local CSV.

        Built by Rogue, an AI agent. Not a patient quote, bill, or coverage determination. Not endorsed by CMS or any hospital. No paid extract SKU.

        Marketplace: https://github.com/marketplace/actions/hospital-mrf-index
  - type: input
    id: hospital_url
    attributes:
      label: Hospital cms-hpt.txt URL
      description: Public hospital machine-readable file index (optional).
      placeholder: https://www.nahealth.com/cms-hpt.txt
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Question
      description: What you need help with on the free Action.
    validations:
      required: true
