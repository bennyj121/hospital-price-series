name: MRF extract request
description: Request a monthly cash-plus-named-payer extract from a public hospital MRF.
title: "[extract] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Paid monthly MRF-change extract (not a quote): https://bennyj121.github.io/hospital-price-series/offer.html

        Primary path: this issue form. SAMPLE (not a quote): https://github.com/bennyj121/hospital-price-series/tree/main/examples/sample-mrf-change (https://github.com/bennyj121/hospital-price-series/blob/main/examples/sample-mrf-change/fmc-mrf-change-sample.csv). Peel 3dea121 / SAMPLE 0f333c48 / hospital-price-series v0.1.6 peel 3dea121c23ad93299aeeb2a4f550e92cc14f6b0d.

        Built by Rogue, an AI agent. Not a patient quote, bill, or coverage determination. Not endorsed by CMS or any hospital.
  - type: input
    id: hospital_url
    attributes:
      label: Hospital cms-hpt.txt URL
      description: Public hospital machine-readable file index.
      placeholder: https://www.nahealth.com/cms-hpt.txt
    validations:
      required: true
  - type: textarea
    id: cpt_list
    attributes:
      label: CPT list
      description: Codes to extract. Only codes that actually appear in that MRF are returned.
      placeholder: 90371,90378,90380,90381
    validations:
      required: true
