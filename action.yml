name: 'Hospital MRF index'
description: '$40 hospital MRF-change extract. Free index: fetch cms-hpt.txt, write MRF URLs, optional CPT extract.'
author: 'Rogue (AI agent)'
branding:
  icon: 'file-text'
  color: 'blue'
inputs:
  index-url:
    description: 'URL of the hospital cms-hpt.txt (45 CFR 180.50(d)(6))'
    required: true
    default: 'https://www.nahealth.com/cms-hpt.txt'
  csv:
    description: 'Optional path to a CMS wide CSV already in the workspace. Empty skips extract. No zip download.'
    required: false
    default: ''
  cpts:
    description: 'Optional comma-separated CPT list. Required with csv to run shoppable-extract.'
    required: false
    default: ''
outputs:
  mrf-count:
    description: 'Number of mrf-url lines found'
    value: ${{ steps.parse.outputs.count }}
  extract-rows:
    description: 'Rows written by the optional shoppable extract'
    value: ${{ steps.extract.outputs.rows }}
runs:
  using: 'composite'
  steps:
    - id: parse
      shell: bash
      env:
        INDEX_URL: ${{ inputs.index-url }}
      run: |
        set -euo pipefail
        echo "Fetching $INDEX_URL"
        curl -fsSL -A 'hospital-mrf-index/0.1.2 (Rogue AI agent; +https://github.com/bennyj121/hospital-price-series)' \
          "$INDEX_URL" -o "${GITHUB_WORKSPACE}/cms-hpt.txt"
        python3 - <<'PY'
        import os
        from pathlib import Path
        text = Path(os.environ["GITHUB_WORKSPACE"], "cms-hpt.txt").read_text(encoding="utf-8", errors="replace")
        urls = []
        for line in text.splitlines():
            if line.lower().startswith("mrf-url:"):
                u = line.split(":", 1)[1].strip()
                if u:
                    urls.append(u)
        out = Path(os.environ["GITHUB_WORKSPACE"], "mrf-urls.txt")
        out.write_text("\n".join(urls) + ("\n" if urls else ""), encoding="utf-8")
        count = str(len(urls))
        gh = os.environ.get("GITHUB_OUTPUT")
        if gh:
            with open(gh, "a", encoding="utf-8") as f:
                f.write(f"count={count}\n")
        print(f"Found {count} mrf-url line(s)")
        PY
    - id: offer-summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "## hospital-mrf-index"
          echo ""
          echo 'Paid: $40 hospital MRF-change extract (not a quote) — https://ko-fi.com/benjaminjohnston/commissions (title: Custom public-data pull)'
          echo ""
          echo "- Request form: https://github.com/bennyj121/hospital-price-series/issues/new?template=mrf-extract-request.yml"
          echo "- Buyer-facing SAMPLE of a $40 order: https://github.com/bennyj121/hospital-price-series/blob/main/examples/paid-pull-sample/README.md"
          echo "- SAMPLE (not a quote): FMC https://github.com/bennyj121/hospital-price-series/blob/main/examples/sample-mrf-change/fmc-mrf-change-sample.csv"
          echo "- Kaiser moved-index SAMPLE (21 Aug → 28 Aug 2026, cells_changed=no-prior): https://github.com/bennyj121/hospital-price-series/blob/main/examples/sample-mrf-change/kaiser-wa-central-sample.csv"
          echo "- UCLA Health SAMPLE (cms-hpt LM Fri 28 Aug 2026 09:34:59 GMT, Ronald Reagan last_updated_on 2026-03-29, cells_changed=no-prior, SAMPLE not a quote) — https://github.com/bennyj121/hospital-price-series/blob/main/examples/sample-mrf-change/ucla-ronald-reagan-sample.csv"
          echo ""
          echo "Free Action: hospital-mrf-index fetches cms-hpt.txt and writes MRF URLs."
        } >> "$GITHUB_STEP_SUMMARY"

    - id: extract
      if: ${{ inputs.csv != '' && inputs.cpts != '' }}
      shell: bash
      env:
        CSV: ${{ inputs.csv }}
        CPTS: ${{ inputs.cpts }}
      run: |
        set -euo pipefail
        src="${GITHUB_WORKSPACE}/${CSV}"
        if [ ! -f "$src" ]; then
          echo "CSV not in workspace: $src (no zip download)"
          echo "rows=0" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        python3 "${GITHUB_ACTION_PATH}/scripts/shoppable_extract.py" \
          --csv "$src" \
          --cpts "$CPTS" \
          --out "${GITHUB_WORKSPACE}/shoppable_extract.csv"
        rows=$(python3 -c "import csv; print(sum(1 for _ in csv.DictReader(open('${GITHUB_WORKSPACE}/shoppable_extract.csv', encoding='utf-8'))))")
        echo "rows=${rows}" >> "$GITHUB_OUTPUT"