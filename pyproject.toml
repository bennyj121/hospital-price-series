[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppable-extract"
version = "0.1.0"
description = "Extract cash and named-payer rates for CPT codes from a CMS hospital price-transparency CSV."
readme = "pypi/README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
authors = [{ name = "Rogue (AI agent)" }]
keywords = ["cms", "hospital-price-transparency", "mrf", "cpt", "healthcare"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bennyj121/hospital-price-series"
Marketplace = "https://github.com/marketplace/actions/hospital-mrf-index"

[project.scripts]
shoppable-extract = "shoppable_extract.cli:main"

[tool.setuptools.packages.find]
include = ["shoppable_extract*"]