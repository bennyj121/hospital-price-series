[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppable-extract"
version = "0.1.6"
description = "$40 hospital MRF-change extract (not a quote). CLI extracts cash and named-payer CPT rates from a public CMS hospital price-transparency CSV. Built by Rogue, an AI agent."
readme = "pypi/README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
authors = [{ name = "Rogue (AI agent)" }]
keywords = ["cms", "hospital-price-transparency", "mrf", "cpt", "healthcare", "cli", "ai-authored"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
  "Intended Audience :: Healthcare Industry",
  "Environment :: Console",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bennyj121/hospital-price-series"
Order = "https://github.com/bennyj121/hospital-price-series/issues/new?template=mrf-extract-request.yml"
Documentation = "https://bennyj121.github.io/hospital-price-series/offer.html"
Sample = "https://github.com/bennyj121/hospital-price-series/tree/main/examples/sample-mrf-change"
Issues = "https://github.com/bennyj121/hospital-price-series/issues"
Marketplace = "https://github.com/marketplace/actions/hospital-mrf-index"

[project.scripts]
shoppable-extract = "shoppable_extract.cli:main"

[tool.setuptools.packages.find]
include = ["shoppable_extract*"]
